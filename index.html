<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>海報人氣投票系統</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 15px; background: #f9f9f9; overflow-x: hidden; }
    h1 { text-align: center; }
    .marquee-container { position: relative; width: 100%; overflow: hidden; padding: 20px 0; white-space: nowrap; }
    .marquee-track { display: inline-flex; gap: 20px; animation: scrollLeft 35s linear infinite; }
    .marquee-container:hover .marquee-track { animation-play-state: paused; }
    @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .poster-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; width: 220px; flex-shrink: 0; display: inline-block; white-space: normal; }
    .poster-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; }
    .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #ccc; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box;}
    button { background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <!-- Google 登入覆蓋層 -->
  <div id="loginOverlay">
    <h2>請先登入 Google 帳號以進行投票</h2>
    <div id="g_id_onload"
         data-client_id="請在這裡貼上您的_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
  </div>

  <h1>活動海報人氣投票</h1>
  <div class="marquee-container">
    <div class="marquee-track" id="posterTrack">載入海報中...</div>
  </div>

  <div class="footer-bar">
    <div class="footer-left">
      <span id="selectionCount" style="margin-right: 15px; font-weight: bold;">已選擇：0 / 3 票</span>
      <button id="submitBtn" onclick="submitVote()" disabled>送出投票</button>
    </div>
    <div class="footer-right" id="userInfo" style="font-size: 13px; color: #666;">尚未登入</div>
  </div>

  <script>
    // ★★★ 將這裡的網址替換為您 GAS 部署後的網頁應用程式網址 ★★★
    const API_URL = "https://script.google.com/macros/s/您的部署ID/exec";
    
    let userEmail = "";
    let allPosters = [];
    let hasVoted = false;

    // Google 登入成功後的回呼函式
    function handleCredentialResponse(response) {
      const data = JSON.parse(atob(response.credential.split('.')[1])); // 解析 JWT 取得信箱
      userEmail = data.email;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('userInfo').innerText = '登入帳號： ' + userEmail;
      fetchData();
      setInterval(fetchData, 5000);
    }

    function fetchData() {
      fetch(`${API_URL}?email=${encodeURIComponent(userEmail)}`)
        .then(res => res.json())
        .then(data => updateUI(data))
        .catch(err => console.error("抓取資料失敗", err));
    }

    function updateUI(data) {
      if (data.userVotes && data.userVotes.length > 0) hasVoted = true;
      allPosters = data.posters;
      
      let generateCards = () => allPosters.map(poster => {
        let isChecked = (hasVoted && data.userVotes.includes(poster.id)) ? 'checked disabled' : (hasVoted ? 'disabled' : '');
        return `
          <div class="poster-card">
            <img src="${poster.imageUrl}" alt="${poster.title}">
            <h3>${poster.title}</h3>
            <p>目前票數：<strong>${poster.votes}</strong> 票</p>
            <label><input type="checkbox" name="posterVote" value="${poster.id}" ${isChecked} onchange="handleSelectionChange()"> 選擇</label>
          </div>
        `;
      }).join('');

      document.getElementById('posterTrack').innerHTML = generateCards() + generateCards();
      
      if (hasVoted) {
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('selectionCount').innerText = '已完成投票';
      } else {
        updateSelectionCount();
      }
    }

    function handleSelectionChange() {
      if (document.querySelectorAll('input[name="posterVote"]:checked').length > 3) {
        alert('一個人只能投 3 票！');
        event.target.checked = false;
      }
      updateSelectionCount();
    }

    function updateSelectionCount() {
      if (hasVoted) return;
      const allCheckboxes = document.querySelectorAll('input[name="posterVote"]');
      let count = 0;
      for(let i = 0; i < allCheckboxes.length / 2; i++) {
        if(allCheckboxes[i].checked) count++;
      }
      document.getElementById('selectionCount').innerText = `已選擇：${count} / 3 票`;
      document.getElementById('submitBtn').disabled = (count !== 3);
    }

    function submitVote() {
      const allCheckboxes = document.querySelectorAll('input[name="posterVote"]');
      let selectedIds = [];
      for(let i = 0; i < allCheckboxes.length / 2; i++) {
        if(allCheckboxes[i].checked) selectedIds.push(allCheckboxes[i].value);
      }

      if (selectedIds.length !== 3 || new Set(selectedIds).size !== 3) {
        alert('請確實選擇 3 張不同的海報！'); return;
      }
      if (!confirm('投票送出後將無法修改，確定要送出嗎？')) return;

      document.getElementById('submitBtn').disabled = true;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ email: userEmail, votes: selectedIds })
      })
      .then(res => res.json())
      .then(response => {
        alert(response.message);
        if (response.success) {
          hasVoted = true;
          fetchData();
        } else {
          document.getElementById('submitBtn').disabled = false;
        }
      })
      .catch(err => {
        alert('發生錯誤：' + err);
        document.getElementById('submitBtn').disabled = false;
      });
    }
  </script>
</body>
</html>
