<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🏆 現場即時戰況 🏆</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: radial-gradient(circle at top, #2b2b2b, #111); 
      color: #fff; 
      margin: 0; 
      padding: 2vh 2vw; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      position: relative; 
    }
    
    /* === 右上角 QR Code 專區 === */
    .qr-container {
      position: absolute;
      top: 2vh;
      right: 2vw;
      background: rgba(255, 255, 255, 0.95);
      padding: 1.5vh;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      z-index: 100;
      transition: transform 0.3s;
    }
    .qr-container:hover {
      transform: scale(1.05);
    }
    .qr-container img {
      width: 10vw; 
      min-width: 120px;
      max-width: 160px;
      height: auto;
      border-radius: 8px;
    }
    .qr-container p {
      margin: 1vh 0 0 0;
      color: #111;
      font-size: 1.8vh;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* === 標題與資訊區 === */
    h1 { color: #fbbc05; font-size: 4vh; margin: 0 0 1.5vh 0; text-shadow: 0 0 15px rgba(251, 188, 5, 0.5); }
    
    .info-board { 
      background: rgba(255, 255, 255, 0.1); 
      padding: 1.5vh 3vw; 
      border-radius: 50px; 
      margin-bottom: 2vh; 
      text-align: center; 
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
    }
    .info-board span { font-size: 2.2vh; color: #4285f4; font-weight: bold; }

    /* === 前三名專區 (大幅放大並置中靠下) === */
    .top3-container { 
      flex: 1; 
      width: 100%;
      display: flex; 
      justify-content: center; 
      align-items: center; /* 改為置中對齊，填補上方空白 */
      gap: 3vw; 
      margin-bottom: 2vh; 
      margin-top: 2vh;
    }
    
    .card { 
      background: #222; 
      border-radius: 16px; 
      padding: 1.5vh; 
      text-align: center; 
      position: relative;
      transition: transform 0.3s;
    }
    .card h3 { margin: 1.5vh 0 0.5vh 0; font-size: 2.2vh; }
    .card .votes { font-size: 3.5vh; font-weight: bold; margin-top: 0.5vh; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .medal-icon { font-size: 5vh; position: absolute; top: -2.5vh; left: -2vw; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }

    /* 金牌 (霸氣放大) */
    .card.gold { 
      width: 28vw; max-width: 420px; 
      border: 5px solid #FFD700; 
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.2); 
      transform: translateY(-3vh); /* 第一名更為突出 */
      background: linear-gradient(145deg, #3a2e00, #222);
      z-index: 5;
    }
    .card.gold img { height: 40vh; width: 100%; object-fit: cover; border-radius: 8px; } 
    .card.gold .votes { color: #FFD700; }

    /* 銀牌 (跟著放大) */
    .card.silver { 
      width: 23vw; max-width: 340px;
      border: 4px solid #E0E0E0; 
      box-shadow: 0 0 20px rgba(224, 224, 224, 0.3); 
      background: linear-gradient(145deg, #2a2a2a, #222);
      transform: translateY(2vh);
    }
    .card.silver img { height: 32vh; width: 100%; object-fit: cover; border-radius: 8px; }
    .card.silver .votes { color: #E0E0E0; }

    /* 銅牌 (跟著放大) */
    .card.bronze { 
      width: 23vw; max-width: 340px;
      border: 4px solid #CD7F32; 
      box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
      background: linear-gradient(145deg, #332010, #222);
      transform: translateY(2vh);
    }
    .card.bronze img { height: 32vh; width: 100%; object-fit: cover; border-radius: 8px; }
    .card.bronze .votes { color: #CD7F32; }

    /* === 下排其餘名次 === */
    .slider-wrapper {
      height: 22vh; /* 高度稍微增加 */
      width: 100vw;
      overflow: hidden;
      padding: 1.5vh 0;
      position: relative;
      flex-shrink: 0; 
    }
    .slider-wrapper::before, .slider-wrapper::after {
      content: ""; position: absolute; top: 0; width: 6vw; height: 100%; z-index: 2;
    }
    .slider-wrapper::before { left: 0; background: linear-gradient(to right, #111, transparent); }
    .slider-wrapper::after { right: 0; background: linear-gradient(to left, #111, transparent); }

    .marquee-track {
      display: flex; gap: 1.5vw; width: max-content;
      animation: scroll 35s linear infinite; 
    }
    .marquee-track:hover { animation-play-state: paused; }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .small-card { 
      background: #333; border-radius: 10px; padding: 1vh; 
      width: 13vw; min-width: 160px; text-align: center; border: 1px solid #555; position: relative;
    }
    .small-card img { width: 100%; height: 12vh; object-fit: cover; border-radius: 6px; }
    .small-card h4 { margin: 1vh 0 0.5vh 0; font-size: 1.8vh; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .small-card .votes { font-size: 2vh; color: #4285f4; font-weight: bold; }
    .rank-badge { position: absolute; top: -1vh; left: -1vh; background: #666; color: white; width: 3.5vh; height: 3.5vh; border-radius: 50%; font-weight: bold; font-size: 1.8vh; line-height: 3.5vh; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

    .update-time { position: fixed; bottom: 0.5vh; right: 2vw; color: #666; font-size: 1.4vh; z-index: 10; }
  </style>
</head>
<body>

  <!-- 右上角 QR Code -->
  <div class="qr-container">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://j5n644s52w-art.github.io/poster-voting/" alt="掃碼投票">
    <p>手機掃碼 立即投票</p>
  </div>

  <h1> 最佳人氣海報爭霸戰 </h1>
  <div class="info-board">
    <span>掃描右上角 QR Code，替小夥伴們打氣！每人最多 3 票 </span>
  </div>

  <div class="top3-container" id="top3Board">
    <h2 style="color: #888;">戰況載入中...</h2>
  </div>

  <div class="slider-wrapper" id="sliderWrapper" style="display: none;">
    <div class="marquee-track" id="othersBoard"></div>
  </div>

  <div class="update-time" id="lastUpdate"></div>

  <script>
    // ★★★ 貼上您原本的 GAS 網址 ★★★
    const API_URL = "https://script.google.com/macros/s/AKfycbynxfHFYTm-o7tthRcKJ-FbuUyWMDWrUg3necNfFgZl9j8z_IOPf-zlqucYhcNobkCmpg/exec";
    
    let lastDataString = ""; 

    function fetchLiveStats() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          let sortedPosters = data.posters.sort((a, b) => b.votes - a.votes);
          
          let currentDataString = JSON.stringify(sortedPosters);
          if (currentDataString === lastDataString) {
            updateClockOnly();
            return; 
          }
          lastDataString = currentDataString;

          let top3 = sortedPosters.slice(0, 3);
          let others = sortedPosters.slice(3);

          let top3Html = '';
          if(top3.length >= 2) top3Html += createTopCard(top3[1], 'silver', '🥈');
          if(top3.length >= 1) top3Html += createTopCard(top3[0], 'gold', '🥇');
          if(top3.length >= 3) top3Html += createTopCard(top3[2], 'bronze', '🥉');
          document.getElementById('top3Board').innerHTML = top3Html;

          if (others.length > 0) {
            document.getElementById('sliderWrapper').style.display = 'block';
            let othersHtml = '';
            others.forEach((poster, index) => {
              othersHtml += `
                <div class="small-card">
                  <div class="rank-badge">${index + 4}</div>
                  <img src="${poster.imageUrl}" alt="${poster.title}">
                  <h4>${poster.title}</h4>
                  <div class="votes">${poster.votes} 票</div>
                </div>
              `;
            });
            document.getElementById('othersBoard').innerHTML = othersHtml + othersHtml;
          } else {
            document.getElementById('sliderWrapper').style.display = 'none';
          }
          
          updateClockOnly();
        })
        .catch(err => console.error("抓取失敗", err));
    }

    function createTopCard(poster, rankClass, medal) {
      return `
        <div class="card ${rankClass}">
          <div class="medal-icon">${medal}</div>
          <img src="${poster.imageUrl}" alt="${poster.title}">
          <h3>${poster.title}</h3>
          <div class="votes">${poster.votes} 票</div>
        </div>
      `;
    }

    function updateClockOnly() {
      let now = new Date();
      document.getElementById('lastUpdate').innerText = `連線狀態：即時更新中... (最後檢查 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')})`;
    }

    fetchLiveStats();
    setInterval(fetchLiveStats, 10000);
  </script>
</body>
</html>
