<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🏆 現場即時戰況 🏆</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: radial-gradient(circle at top, #2b2b2b, #111); 
      color: #fff; 
      margin: 0; 
      padding: 1.5vh 2vw; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    
    h1 { color: #fbbc05; font-size: 3.5vh; margin: 0 0 1vh 0; text-shadow: 0 0 15px rgba(251, 188, 5, 0.5); }
    
    .info-board { 
      background: rgba(255, 255, 255, 0.1); 
      padding: 1vh 3vw; 
      border-radius: 50px; 
      margin-bottom: 1.5vh; 
      text-align: center; 
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
    }
    .info-board span { font-size: 1.8vh; color: #4285f4; font-weight: bold; }

    /* === 前三名專區 === */
    .top3-container { 
      flex: 1; 
      width: 100%;
      display: flex; 
      justify-content: center; 
      align-items: flex-end; 
      gap: 2vw; 
      margin-bottom: 1.5vh; 
    }
    
    .card { 
      background: #222; 
      border-radius: 12px; 
      padding: 1.2vh; 
      text-align: center; 
      position: relative;
      transition: transform 0.3s;
    }
    .card h3 { margin: 1vh 0 0.5vh 0; font-size: 1.8vh; }
    .card .votes { font-size: 2.8vh; font-weight: bold; margin-top: 0.5vh; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .medal-icon { font-size: 4vh; position: absolute; top: -2vh; left: -1.5vw; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }

    /* 金牌 */
    .card.gold { 
      width: 22vw; max-width: 260px; /* 變窄 */
      border: 4px solid #FFD700; 
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255, 215, 0, 0.2); 
      transform: translateY(-2vh); 
      background: linear-gradient(145deg, #3a2e00, #222);
    }
    .card.gold img { height: 28vh; width: 100%; object-fit: cover; border-radius: 6px; } /* 圖片變矮 */
    .card.gold .votes { color: #FFD700; }

    /* 銀牌 */
    .card.silver { 
      width: 18vw; max-width: 220px;
      border: 3px solid #E0E0E0; 
      box-shadow: 0 0 15px rgba(224, 224, 224, 0.3); 
      background: linear-gradient(145deg, #2a2a2a, #222);
    }
    .card.silver img { height: 22vh; width: 100%; object-fit: cover; border-radius: 6px; }
    .card.silver .votes { color: #E0E0E0; }

    /* 銅牌 */
    .card.bronze { 
      width: 18vw; max-width: 220px;
      border: 3px solid #CD7F32; 
      box-shadow: 0 0 15px rgba(205, 127, 50, 0.3);
      background: linear-gradient(145deg, #332010, #222);
    }
    .card.bronze img { height: 22vh; width: 100%; object-fit: cover; border-radius: 6px; }
    .card.bronze .votes { color: #CD7F32; }

    /* === 下排其餘名次 === */
    .slider-wrapper {
      height: 18vh; /* 跑馬燈整體變矮 */
      width: 100vw;
      overflow: hidden;
      padding: 1vh 0;
      position: relative;
      flex-shrink: 0; 
    }
    .slider-wrapper::before, .slider-wrapper::after {
      content: ""; position: absolute; top: 0; width: 5vw; height: 100%; z-index: 2;
    }
    .slider-wrapper::before { left: 0; background: linear-gradient(to right, #111, transparent); }
    .slider-wrapper::after { right: 0; background: linear-gradient(to left, #111, transparent); }

    .marquee-track {
      display: flex; gap: 1.2vw; width: max-content;
      animation: scroll 35s linear infinite; /* 放慢一點點輪播速度 */
    }
    .marquee-track:hover { animation-play-state: paused; }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .small-card { 
      background: #333; border-radius: 8px; padding: 0.8vh; 
      width: 11vw; min-width: 130px; text-align: center; border: 1px solid #555; position: relative;
    }
    .small-card img { width: 100%; height: 9.5vh; object-fit: cover; border-radius: 4px; }
    .small-card h4 { margin: 0.8vh 0 0.5vh 0; font-size: 1.5vh; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .small-card .votes { font-size: 1.8vh; color: #4285f4; font-weight: bold; }
    .rank-badge { position: absolute; top: -0.8vh; left: -0.8vh; background: #666; color: white; width: 3vh; height: 3vh; border-radius: 50%; font-weight: bold; font-size: 1.5vh; line-height: 3vh; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

    .update-time { position: fixed; bottom: 0.5vh; right: 2vw; color: #666; font-size: 1.2vh; z-index: 10; }
  </style>
</head>
<body>

  <h1>🏆 最佳人氣海報爭霸戰 🏆</h1>
  <div class="info-board">
    <span>🔥 掃描海報旁 QR Code，投下您神聖的一票！每人最多 3 票 🔥</span>
  </div>

  <div class="top3-container" id="top3Board">
    <h2 style="color: #888;">戰況載入中...</h2>
  </div>

  <div class="slider-wrapper" id="sliderWrapper" style="display: none;">
    <div class="marquee-track" id="othersBoard"></div>
  </div>

  <div class="update-time" id="lastUpdate"></div>

  <script>
    // ★★★ 貼上您原本的 GAS 網址 ★★★
    const API_URL = "https://script.google.com/macros/s/AKfycbynxfHFYTm-o7tthRcKJ-FbuUyWMDWrUg3necNfFgZl9j8z_IOPf-zlqucYhcNobkCmpg/exec";
    
    let lastDataString = ""; 

    function fetchLiveStats() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          let sortedPosters = data.posters.sort((a, b) => b.votes - a.votes);
          
          let currentDataString = JSON.stringify(sortedPosters);
          if (currentDataString === lastDataString) {
            updateClockOnly();
            return; 
          }
          lastDataString = currentDataString;

          let top3 = sortedPosters.slice(0, 3);
          let others = sortedPosters.slice(3);

          let top3Html = '';
          if(top3.length >= 2) top3Html += createTopCard(top3[1], 'silver', '🥈');
          if(top3.length >= 1) top3Html += createTopCard(top3[0], 'gold', '🥇');
          if(top3.length >= 3) top3Html += createTopCard(top3[2], 'bronze', '🥉');
          document.getElementById('top3Board').innerHTML = top3Html;

          if (others.length > 0) {
            document.getElementById('sliderWrapper').style.display = 'block';
            let othersHtml = '';
            others.forEach((poster, index) => {
              othersHtml += `
                <div class="small-card">
                  <div class="rank-badge">${index + 4}</div>
                  <img src="${poster.imageUrl}" alt="${poster.title}">
                  <h4>${poster.title}</h4>
                  <div class="votes">${poster.votes} 票</div>
                </div>
              `;
            });
            document.getElementById('othersBoard').innerHTML = othersHtml + othersHtml;
          } else {
            document.getElementById('sliderWrapper').style.display = 'none';
          }
          
          updateClockOnly();
        })
        .catch(err => console.error("抓取失敗", err));
    }

    function createTopCard(poster, rankClass, medal) {
      return `
        <div class="card ${rankClass}">
          <div class="medal-icon">${medal}</div>
          <img src="${poster.imageUrl}" alt="${poster.title}">
          <h3>${poster.title}</h3>
          <div class="votes">${poster.votes} 票</div>
        </div>
      `;
    }

    function updateClockOnly() {
      let now = new Date();
      document.getElementById('lastUpdate').innerText = `連線狀態：即時更新中... (最後檢查 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')})`;
    }

    fetchLiveStats();
    setInterval(fetchLiveStats, 10000);
  </script>
</body>
</html>
